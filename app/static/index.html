<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乐师对外教学助手</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="/brand/f_logo.png" alt="乐山师范学院">
    <div>
      <h1>对外教学助手</h1>
      <p>随手拍讲解 · 手动专名 · 中英日法西韩泰</p>
    </div>
  </header>
  <main class="layout">
    <section class="card">
      <h2>1. 上传图片</h2>
      <label class="drop" for="file">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
        <img id="preview" alt="预览" hidden>
        <span id="hint">走到哪里拍到哪里：牌匾、佛语、造像、校园一角（jpg / png / webp，小于 4MB）</span>
      </label>
      <div class="row">
        <button id="analyze" type="button">识别并讲解</button>
        <p id="status" class="muted"></p>
      </div>
      <label class="field">若地点不准，可手改场景
        <select id="scene" disabled>
          <option value="">先上传图片</option>
        </select>
      </label>
      <div class="manual">
        <label class="field">或手动输入专名（如：乐山大佛下山虎）
          <input id="query" type="text" maxlength="80" placeholder="乐山大佛下山虎">
        </label>
        <div class="row">
          <button id="translate" type="button">七语讲解</button>
        </div>
      </div>
    </section>
    <section class="card">
      <h2>2. 智能体四步</h2>
      <ol class="steps" id="steps">
        <li data-step="identify">分流 · 识景识字</li>
        <li data-step="load">装载 · 术语包</li>
        <li data-step="lock">锁定 · 专名</li>
        <li data-step="deliver">交付 · 七语讲解</li>
      </ol>
      <p id="ident" class="muted">尚未识别。</p>
      <p id="ocr" class="ocr" hidden></p>
      <div id="terms" class="terms"></div>
    </section>
    <section class="card wide">
      <h2>3. 图中内容讲解</h2>
      <div class="langs" id="langs">
        <article><h3>中文</h3><p id="zh"></p></article>
        <article><h3>English</h3><p id="en"></p></article>
        <article><h3>日本語</h3><p id="ja"></p></article>
        <article><h3>Français</h3><p id="fr"></p></article>
        <article><h3>Español</h3><p id="es"></p></article>
        <article><h3>한국어</h3><p id="ko"></p></article>
        <article><h3>ไทย</h3><p id="th"></p></article>
      </div>
    </section>
    <section class="card wide">
      <h2>4. 继续对话</h2>
      <div id="chat" class="chat"></div>
      <form id="ask" class="row">
        <input id="q" type="text" placeholder="例如：牌匾上这几个字什么意思？这句佛语怎么跟留学生讲？" autocomplete="off" disabled>
        <button type="submit" disabled>发送</button>
      </form>
    </section>
  </main>
  <footer>乐山师范学院 · 融合创新+，智绘乐师新征程</footer>
  <script src="/static/app.js"></script>
</body>
</html>
